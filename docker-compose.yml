services:
  nginx:
    image: nginx:stable
    container_name: gtech_nginx
    ports:
      - "80:80"
    volumes:
      - ./backend:/var/www/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php

  php:
    build: ./php
    container_name: gtech_php
    volumes:
      - ./backend:/var/www/html

  db:
    image: mysql:8
    container_name: gtech_db
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: gtech
    ports:
      - "3306:3306"
    volumes:
      - dbdata:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin
    container_name: gtech_phpmyadmin
    ports:
      - "8080:80"
    environment:
      PMA_HOST: db
    depends_on:
      - db

volumes:
  dbdata: