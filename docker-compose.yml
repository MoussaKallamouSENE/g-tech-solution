services:
  nginx:
    image: nginx:stable
    container_name: gtech_nginx
    ports:
      - "80:80"
    volumes:
      - ./backend:/var/www/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php

  php:
    build: ./php
    container_name: gtech_php
    env_file:
      - ./backend/.env
    environment:
      # Toujours aligné sur le mot de passe root du service db (cf. MYSQL_ROOT_PASSWORD).
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in the project .env file}
    volumes:
      - ./backend:/var/www/html
    depends_on:
      - db
    restart: unless-stopped

  queue-worker:
    build: ./php
    container_name: gtech_queue_worker
    command: php artisan queue:work database --queue=default --tries=5 --timeout=60
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in the project .env file}
    volumes:
      - ./backend:/var/www/html
    depends_on:
      - db

  delivery-scheduler:
    build: ./php
    container_name: gtech_delivery_scheduler
    command: php artisan schedule:work
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in the project .env file}
    volumes:
      - ./backend:/var/www/html
    depends_on:
      - db

  db:
    image: mysql:8
    container_name: gtech_db
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in the project .env file}
      MYSQL_DATABASE: gtech
    ports:
      - "3306:3306"
    volumes:
      - dbdata:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin
    container_name: gtech_phpmyadmin
    ports:
      - "8080:80"
    environment:
      PMA_HOST: db
    depends_on:
      - db

  frontend:
    build: ./frontend
    container_name: gtech_frontend
    ports:
      - "3000:80"
    depends_on:
      - nginx
    restart: unless-stopped

volumes:
  dbdata: