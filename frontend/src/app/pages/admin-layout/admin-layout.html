<div class="flex min-h-screen flex-col bg-mist lg:flex-row">
  @if (auth.user()?.role === 'admin') {
    <aside class="flex shrink-0 flex-col gap-4 bg-ink p-4 lg:sticky lg:top-0 lg:h-screen lg:w-62 lg:gap-7 lg:pt-6">
      <a routerLink="/admin" class="flex items-center gap-2.5 rounded-lg px-1.5 focus-visible:outline-2 focus-visible:outline-white">
        <span class="flex h-9 w-9 items-center justify-center rounded-[10px] bg-cobalt font-display text-lg font-bold text-white">G</span>
        <span class="font-display text-xl font-bold text-white">G-Tech</span>
      </a>

      <nav aria-label="Administration" class="flex flex-row flex-wrap gap-1 lg:flex-col">
        <a routerLink="/admin" routerLinkActive="bg-cobalt text-white!" [routerLinkActiveOptions]="{ exact: true }" class="flex items-center gap-3 rounded-[10px] px-3.5 py-3 text-sm font-medium text-[#AEB9CC] hover:bg-white/10 hover:text-white focus-visible:outline-2 focus-visible:outline-white">
          <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>
          Tableau de bord
        </a>
        <a routerLink="/admin/commandes" routerLinkActive="bg-cobalt text-white!" class="flex items-center gap-3 rounded-[10px] px-3.5 py-3 text-sm font-medium text-[#AEB9CC] hover:bg-white/10 hover:text-white focus-visible:outline-2 focus-visible:outline-white">
          <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 7h12l1 13H5z"/><path d="M9 7a3 3 0 0 1 6 0"/></svg>
          Commandes
        </a>
        <a routerLink="/admin/produits" routerLinkActive="bg-cobalt text-white!" class="flex items-center gap-3 rounded-[10px] px-3.5 py-3 text-sm font-medium text-[#AEB9CC] hover:bg-white/10 hover:text-white focus-visible:outline-2 focus-visible:outline-white">
          <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7.5 12 3l9 4.5v9L12 21l-9-4.5z"/><path d="M3 7.5 12 12l9-4.5M12 12v9"/></svg>
          Produits
        </a>
        <a routerLink="/admin/maintenance" routerLinkActive="bg-cobalt text-white!" class="flex items-center gap-3 rounded-[10px] px-3.5 py-3 text-sm font-medium text-[#AEB9CC] hover:bg-white/10 hover:text-white focus-visible:outline-2 focus-visible:outline-white">
          <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.5 6.5a4 4 0 0 0-5 5L4 17l3 3 5.5-5.5a4 4 0 0 0 5-5l-2.5 2.5-2-.5-.5-2z"/></svg>
          Réparations
        </a>
        <a routerLink="/" class="flex items-center gap-3 rounded-[10px] px-3.5 py-3 text-sm font-medium text-[#AEB9CC] hover:bg-white/10 hover:text-white focus-visible:outline-2 focus-visible:outline-white lg:hidden">
          Voir la boutique
        </a>
      </nav>

      <div class="mt-auto hidden items-center gap-2.5 rounded-xl bg-white/5 p-3 lg:flex">
        <span class="flex h-9 w-9 shrink-0 items-center justify-center rounded-full bg-cobalt text-xs font-semibold text-white">{{ initials() }}</span>
        <span class="min-w-0 flex-1">
          <span class="block truncate text-sm font-semibold text-white">{{ auth.user()?.name }}</span>
          <a routerLink="/" class="block text-xs text-[#AEB9CC] hover:text-white focus-visible:outline-2 focus-visible:outline-white">Voir la boutique</a>
        </span>
        <button type="button" (click)="logout()" aria-label="Se déconnecter" class="rounded-lg p-2 text-[#AEB9CC] hover:bg-white/10 hover:text-white focus-visible:outline-2 focus-visible:outline-white">
          <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5M21 12H9"/></svg>
        </button>
      </div>
    </aside>
  }

  <div class="min-w-0 flex-1">
    @if (auth.user()?.role !== 'admin') {
      <a routerLink="/" class="m-4 inline-block text-sm font-medium text-ink/70 hover:text-cobalt">&larr; Retour à la boutique</a>
    }
    <router-outlet />
  </div>
</div>
