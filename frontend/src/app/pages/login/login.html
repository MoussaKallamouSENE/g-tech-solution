<div class="relative overflow-hidden">
  <div class="pointer-events-none absolute inset-0 hero-mesh opacity-[0.07]"></div>
  <div class="page-wrap relative flex min-h-[70vh] items-center justify-center py-14">
    <div class="card w-full max-w-md p-8 md:p-10">
      <a routerLink="/" class="flex items-center gap-2">
        <span class="flex h-9 w-9 items-center justify-center rounded-xl bg-cobalt font-display text-lg font-extrabold text-white">G</span>
        <span class="font-display text-lg font-extrabold">G-Tech</span>
      </a>
      <h1 class="mt-8 font-display text-3xl font-extrabold tracking-tight">Connexion</h1>
      <p class="mt-2 text-muted">Pas encore de compte ? <a routerLink="/inscription" class="font-semibold text-cobalt hover:underline">Créer un compte</a></p>

      <form (submit)="submit($event, email.value, password.value)" class="mt-8 space-y-5">
        @if (error()) {
          <p role="alert" class="alert-error">{{ error() }}</p>
        }
        <div>
          <label for="email" class="field-label">Adresse e-mail</label>
          <input #email id="email" type="email" required autocomplete="email" />
        </div>
        <div>
          <label for="password" class="field-label">Mot de passe</label>
          <input #password id="password" type="password" required autocomplete="current-password" />
        </div>
        <button type="submit" [disabled]="loading()" class="btn btn-primary w-full disabled:opacity-50">
          {{ loading() ? 'Connexion...' : 'Se connecter' }}
        </button>
      </form>
    </div>
  </div>
</div>
