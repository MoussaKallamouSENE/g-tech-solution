<div class="page-wrap py-10 md:py-14 max-w-md mx-auto">
  <a routerLink="/connexion" class="text-sm font-medium text-ink/70 hover:text-cobalt focus-visible:outline-2 focus-visible:outline-cobalt">&larr; Retour à la connexion</a>

  <h1 class="mt-6 font-display text-3xl font-bold tracking-tight">Réinitialiser le mot de passe</h1>
  <p class="mt-1 text-sm text-muted">Choisissez un nouveau mot de passe (8 caractères minimum).</p>

  @if (message()) {
    <p role="status" class="mt-4 rounded-lg border border-mint/30 bg-mint/10 p-3 text-sm">{{ message() }}</p>
  }
  @if (error()) {
    <p role="alert" class="mt-4 rounded-lg border border-red-200 bg-red-50 p-3 text-sm text-red-700">{{ error() }}</p>
  }

  <form (submit)="submit()" class="mt-8 rounded-2xl border border-line bg-white p-6">
    <div>
      <label class="block text-sm font-medium mb-1">Nouveau mot de passe</label>
      <input
        type="password"
        formControlName="password"
        placeholder="••••••••"
        class="w-full rounded-lg border border-line px-3 py-2 focus:border-cobalt focus:outline-none disabled:opacity-60"
        [disabled]="resetting()"
      />
      @if (form.get('password')?.invalid && form.get('password')?.touched) {
        <p class="mt-1 text-xs text-red-600">Au moins 8 caractères.</p>
      }
    </div>
    <div>
      <label class="block text-sm font-medium mb-1">Confirmer le nouveau mot de passe</label>
      <input
        type="password"
        formControlName="password_confirmation"
        placeholder="••••••••"
        class="w-full rounded-lg border border-line px-3 py-2 focus:border-cobalt focus:outline-none disabled:opacity-60"
        [disabled]="resetting()"
      />
    </div>
    <button
      type="submit"
      [disabled]="resetting() || form.invalid"
      class="mt-4 rounded-full bg-cobalt px-5 py-2.5 text-sm font-semibold text-white hover:bg-cobalt-dark disabled:opacity-50"
    >
      {{ resetting() ? 'Réinitialisation...' : 'Réinitialiser le mot de passe' }}
    </button>
  </form>
</div>
