<div class="flex min-h-screen flex-col">
  <header class="sticky top-0 z-10 border-b border-line bg-white/95 backdrop-blur">
    <div class="mx-auto flex max-w-6xl items-center gap-6 px-4 py-3">
      <a routerLink="/" class="flex items-center gap-2 rounded-lg focus-visible:outline-2 focus-visible:outline-cobalt">
        <span class="flex h-9 w-9 items-center justify-center rounded-lg bg-cobalt font-display text-lg font-bold text-white">G</span>
        <span class="font-display text-xl font-bold tracking-tight">G-Tech</span>
      </a>

      <nav class="hidden items-center gap-6 text-sm font-medium text-ink/70 md:flex">
        <a routerLink="/" class="text-ink hover:text-cobalt">Accueil</a>
        <a routerLink="/" class="hover:text-cobalt">Produits</a>
        <a routerLink="/services" class="hover:text-cobalt">Services</a>
        <a href="#" class="hover:text-cobalt">Contact</a>
      </nav>

      <div class="ml-auto flex items-center gap-3">
        <form (submit)="onSearch($event, q.value)" role="search" class="hidden items-center gap-2 rounded-full border border-line bg-mist px-4 py-2 text-sm text-ink/60 focus-within:border-cobalt md:flex">
          <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input #q type="search" name="q" placeholder="Rechercher un produit" aria-label="Rechercher un produit" class="w-48 bg-transparent outline-none placeholder:text-ink/40" />
        </form>

        @if (auth.user(); as user) {
          <a routerLink="/commandes" title="Mes commandes" class="hidden text-sm font-medium hover:text-cobalt sm:block">{{ user.name }}</a>
          @if (user.role === 'admin') { <a routerLink="/admin" class="rounded-full bg-ink px-4 py-2 text-sm font-medium text-white hover:bg-cobalt focus-visible:outline-2 focus-visible:outline-cobalt">Administration</a> }
          <button type="button" (click)="logout()" class="rounded-full border border-line px-4 py-2 text-sm font-medium hover:border-cobalt hover:text-cobalt focus-visible:outline-2 focus-visible:outline-cobalt">Déconnexion</button>
        } @else {
          <a routerLink="/connexion" class="rounded-full border border-line px-4 py-2 text-sm font-medium hover:border-cobalt hover:text-cobalt focus-visible:outline-2 focus-visible:outline-cobalt">Connexion</a>
        }

        <a routerLink="/panier" aria-label="Panier" class="relative flex h-10 w-10 items-center justify-center rounded-full border border-line bg-white hover:border-cobalt hover:text-cobalt focus-visible:outline-2 focus-visible:outline-cobalt">
          <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6h15l-1.5 9h-12z"/><path d="M6 6 5 3H2"/><circle cx="9" cy="20" r="1"/><circle cx="18" cy="20" r="1"/></svg>
          @if (cart.count() > 0) { <span class="absolute -right-1 -top-1 flex h-5 min-w-5 items-center justify-center rounded-full bg-cobalt px-1 text-xs font-semibold text-white">{{ cart.count() }}</span> }
        </a>
      </div>
    </div>
  </header>

  <div class="flex-1">
    <router-outlet />
  </div>

  <footer class="bg-ink text-white/70">
    <div class="mx-auto flex max-w-6xl flex-col gap-2 px-4 py-8 text-sm md:flex-row md:justify-between">
      <p><span class="font-display font-semibold text-white">G-Tech</span> &ndash; Matériel informatique et maintenance</p>
      <p>Dakar, Sénégal</p>
    </div>
  </footer>
</div>
